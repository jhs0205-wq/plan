<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나만의 군인 플래너</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f7f6; padding: 20px; }
        .nav { margin-bottom: 20px; }
        .page { display: none; }
        .active { display: block; }
        .week-container { display: flex; gap: 10px; }
        .day-card { background: white; padding: 15px; border-radius: 8px; width: 14%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .todo-area { min-height: 15px; border-bottom: 1px dashed #ccc; padding: 5px; margin-bottom: 10px; outline: none; }
        button { cursor: pointer; padding: 8px 12px; background: #2ecc71; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 탭 메뉴 -->
    <div class="nav">
        <button onclick="switchPage('page1')">📅 주간 계획</button>
        <button onclick="switchPage('page2')">📆 달력 & 전역일</button>
    </div>

    <!-- 1페이지: 주간 계획 -->
    <div id="page1" class="page active">
        <h2>이번 주 계획</h2>
        <div style="margin-bottom: 15px;">
            <button onclick="copyDefaultRoutine()">📋 기본 루틴 복사해오기</button>
            <button onclick="saveWeeklyPlan()" style="background: #3498db;">💾 변경사항 저장</button>
        </div>
        <div class="week-container">
            <!-- 월요일 예시 (화~일요일도 동일한 구조로 반복 생성) -->
            <div class="day-card">
                <h3>월요일</h3>
                <div id="plan-mon" class="todo-area" contenteditable="true">여기를 눌러 계획을 작성하세요.</div>
            </div>
            <!-- 반복... -->
        </div>
    </div>

    <!-- 2페이지: 달력 -->
    <div id="page2" class="page">
        <h2>달력 및 주요 일정</h2>
        <div id="d-day-zone" style="font-size: 20px; font-weight: bold; color: #e74c3c; margin-bottom: 20px;"></div>
        <!-- 여기에 FullCalendar 라이브러리가 렌더링될 영역 배치 -->
        <div id="calendar-view" style="background: white; padding: 20px; border-radius: 8px;">[달력 구동 영역]</div>
    </div>

    <script>
        // 페이지 전환 함수
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // 기본 루틴 복사 기능
        function copyDefaultRoutine() {
            const defaultRoutine = "💪 개인 정비 & 연경(개인운동)\n📚 공부 2시간\n🏃 3km 뜀걸음";
            document.getElementById('plan-mon').innerText = defaultRoutine;
            // 나머지 요일도 동일하게 매핑 가능
        }

        // 로컬 스토리지 저장 기능
        function saveWeeklyPlan() {
            const monPlan = document.getElementById('plan-mon').innerText;
            localStorage.setItem('mon_plan', monPlan);
            alert('계획이 저장되었습니다!');
        }

        // 초기 데이터 로드 및 D-Day 계산 로직을 여기에 추가 가능
    </script>
</body>
</html>
